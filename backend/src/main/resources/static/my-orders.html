<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Artify | My Orders</title>

<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Cinzel:wght@400..900&family=Montserrat:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">

<style>
.orders-box{
  max-width:1000px;
  margin:100px auto;
  background:white;
  padding:50px;
  border-radius:20px;
  box-shadow:0 40px 90px rgba(0,0,0,.12);
}
.orders-box h2{
  text-align:center;
  margin-bottom:30px;
}
.order{
  border-bottom:1px solid #eee;
  padding:25px 0;
}
.items{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}
.item{
  width:180px;
  text-align:center;
}
.item img{
  width:100%;
  border-radius:12px;
}
.review-btn{
  margin-top:10px;
  background:#6c6cff;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
}
.empty{
  text-align:center;
  margin-top:40px;
}
.empty button{
  margin-top:20px;
}
</style>
</head>

<body>

<header class="site-header">
  <div class="header-row">
    <div class="brand">
      <img src="assets/logo.png" class="brand-logo">
      <span class="brand-name">ARTIFY</span>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="cart.html">Cart</a>
      <a href="checkout.html">Checkout</a>
    </nav>

    <div class="auth-area" id="authArea"></div>
  </div>
  <hr class="header-line">
</header>

<div class="orders-box">
  <h2>My Orders</h2>
  <div id="orders"></div>

  <div class="empty" id="empty" style="display:none;">
    <h3>No orders yet</h3>
    <p>Start exploring amazing art.</p>
    <button onclick="window.location='catalogue.html'">Go to Catalogue</button>
  </div>
</div>

<script src="js/headerAuth.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("currentUser"));
const ordersBox = document.getElementById("orders");
const emptyBox = document.getElementById("empty");

if(!user){
  window.location.href = "login.html";
}

const orders = JSON.parse(localStorage.getItem("artify_orders")) || [];
const myOrders = orders.filter(o => o.buyerEmail === user.email);

if(myOrders.length === 0){
  emptyBox.style.display = "block";
}

myOrders.forEach(order => {
  let html = `
    <div class="order">
      <p><strong>Order Date:</strong> ${order.date}</p>
      <div class="items">
  `;

  order.items.forEach(item => {
    html += `
      <div class="item">
        <img src="${item.image}">
        <p>${item.title}</p>
        <p>RM ${item.price}</p>
        <button class="review-btn"
          onclick="leaveReview('${item.title}')">
          Leave Review
        </button>
      </div>
    `;
  });

  html += "</div></div>";
  ordersBox.innerHTML += html;
});

function leaveReview(product){
  localStorage.setItem("review_product", product);
  window.location.href = "leave-review.html";
}
</script>

</body>
</html>
